name: sigap
description: 'SIGAP - Platform pemetaan dan monitoring pembangunan desa.'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local database
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

  # Networking
  dio: ^5.7.0

  # Navigation
  go_router: ^14.6.2

  # Maps
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.4.0
  flutter_map_heatmap: ^0.0.8
  latlong2: ^0.9.1

  # Camera & Location
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  exif: ^3.3.0
  image: ^4.3.0

  # Connectivity
  connectivity_plus: ^6.1.1

  # Icons
  cupertino_icons: ^1.0.8

  # Utilities
  flutter_secure_storage: ^9.2.2
  share_plus: ^10.1.4
  crypto: ^3.0.6
  workmanager: ^0.6.0
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1
  google_fonts: ^6.2.1

  # Notifications
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
